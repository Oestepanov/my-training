<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10140d" />
    <meta name="description" content="Приватный дневник тренировок с хранением данных в GitHub" />
    <title>Мои тренировки</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">Персональный дневник</p>
        <h1>Мои тренировки</h1>
      </div>
      <button id="connectionButton" class="status-button" type="button">
        <span class="status-dot"></span>
        <span id="connectionLabel">Подключить данные</span>
      </button>
    </header>

    <main class="shell">
      <section id="connectionPanel" class="panel connection-panel">
        <div>
          <h2>Приватное подключение</h2>
          <p class="muted">
            Токен используется только в памяти этой вкладки и исчезнет после закрытия или обновления страницы.
          </p>
        </div>
        <form id="connectionForm" class="connection-form">
          <label>
            Fine-grained PAT
            <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" required />
          </label>
          <label>
            Репозиторий данных
            <input id="repoInput" value="my-training-data" autocomplete="off" spellcheck="false" required />
          </label>
          <button class="primary" type="submit">Подключить</button>
        </form>
        <p id="connectionMessage" class="message" role="status"></p>
      </section>

      <section id="app" class="hidden" aria-live="polite">
        <nav class="tabs" aria-label="Разделы приложения">
          <button class="tab active" data-view="workout" type="button">Тренировка</button>
          <button class="tab" data-view="history" type="button">История</button>
          <button class="tab" data-view="progress" type="button">Прогресс</button>
        </nav>

        <section id="workoutView" class="view">
          <div class="workout-head">
            <div>
              <p class="eyebrow">Текущая программа</p>
              <h2 id="workoutTitle">Тренировка</h2>
            </div>
            <label class="select-label">
              Выбор
              <select id="workoutSelect"></select>
            </label>
          </div>
          <div class="progress-row">
            <span id="remainingLabel">Осталось: 0</span>
            <div class="progress-track"><span id="completionBar"></span></div>
          </div>
          <form id="workoutForm">
            <div id="exerciseList" class="exercise-list"></div>
            <div class="save-row">
              <label>
                Дата
                <input id="sessionDate" type="date" required />
              </label>
              <button id="saveButton" class="primary" type="submit">Сохранить тренировку</button>
            </div>
          </form>
        </section>

        <section id="historyView" class="view hidden">
          <div class="section-head">
            <div>
              <p class="eyebrow">Сохранённые занятия</p>
              <h2>История</h2>
            </div>
          </div>
          <div id="historyList" class="history-list"></div>
        </section>

        <section id="progressView" class="view hidden">
          <div class="section-head progress-head">
            <div>
              <p class="eyebrow">Рабочий вес</p>
              <h2>Прогресс</h2>
            </div>
            <label class="select-label">
              Упражнение
              <select id="exerciseSelect"></select>
            </label>
          </div>
          <div class="chart-card">
            <canvas id="progressChart" width="900" height="420" aria-label="График прогресса"></canvas>
            <p id="chartEmpty" class="empty hidden">Для графика пока недостаточно данных.</p>
          </div>
        </section>

        <p id="appMessage" class="message" role="status"></p>
      </section>
    </main>

    <template id="exerciseTemplate">
      <article class="exercise-card">
        <div class="exercise-title-row">
          <label class="check-wrap">
            <input class="done-input" type="checkbox" />
            <span class="checkmark">✓</span>
          </label>
          <div>
            <h3 class="exercise-name"></h3>
            <p class="previous muted"></p>
          </div>
        </div>
        <div class="metric-grid">
          <label>Вес, кг<input class="weight-input" type="number" min="0" step="0.5" inputmode="decimal" /></label>
          <label>Подходы<input class="sets-input" type="number" min="0" step="1" inputmode="numeric" /></label>
          <label>Повторения<input class="reps-input" type="number" min="0" step="1" inputmode="numeric" /></label>
        </div>
      </article>
    </template>

    <script src="core.js"></script>
    <script src="app.js"></script>
  </body>
</html>
