name: Android APK
on:
  push:
    branches: [android]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          gradle -p android :app:assembleRelease :app:assembleDebugAndroidTest
      - name: Package unsigned APK and signing tool
        run: |
          mkdir -p android-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-output/MyTraining-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-output/apksigner.jar
          git rev-parse HEAD > android-output/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MyTraining-unsigned
          path: android-output/*
          retention-days: 30
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Check app on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle -p android :app:connectedDebugAndroidTest
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-results
          path: android/app/build/reports/androidTests/
